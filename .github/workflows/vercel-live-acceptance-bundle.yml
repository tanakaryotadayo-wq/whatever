name: Vercel live acceptance bundle

on:
  push:
    branches:
      - 'akashic/v0.9-vercel-live-acceptance'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Assemble canonical standalone gateway
        run: |
          set -euo pipefail
          mkdir -p bundle/packages
          cp -R deploy/vercel-chatgpt-app/app bundle/app
          cp -R deploy/vercel-chatgpt-app/lib bundle/lib
          cp -R deploy/vercel-chatgpt-app/workflows bundle/workflows
          cp deploy/vercel-chatgpt-app/next.config.mjs bundle/next.config.mjs
          cp deploy/vercel-chatgpt-app/vercel.json bundle/vercel.json
          cp -R packages/contracts bundle/packages/contracts
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('deploy/vercel-chatgpt-app/package.json', 'utf8'));
          source.name = 'akashic-vercel-live-acceptance';
          source.version = '0.9.0-live-acceptance';
          source.dependencies['@akashic/contracts'] = 'file:./packages/contracts';
          fs.writeFileSync('bundle/package.json', JSON.stringify(source, null, 2) + '\n');
          NODE
          cd bundle
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(!p.packages?.['node_modules/workflow']) process.exit(1)"
      - name: Upload standalone deployment source
        uses: actions/upload-artifact@v4
        with:
          name: akashic-vercel-live-acceptance-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
