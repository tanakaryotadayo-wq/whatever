name: Akashic v0.9 Vercel lock bootstrap

on:
  push:
    branches:
      - 'akashic/v0.9-vercel-workflow-slice'

permissions:
  contents: write

concurrency:
  group: akashic-v09-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: akashic/v0.9-vercel-workflow-slice
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve exact workspace dependency graph
        run: npm install
      - name: Commit refreshed lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(deps): lock Vercel Workflow adapter'
            git push origin HEAD:akashic/v0.9-vercel-workflow-slice
          fi
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Contract and adapter tests
        run: npm test
      - name: Temporal durable P0 integration
        run: npm run test:p0
      - name: Vercel Workflow gateway build
        env:
          WORKFLOW_TARGET_WORLD: local
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build:gateway
