name: Finalize official Codex App Server certification

on:
  push:
    branches:
      - akashic/v0.10-codex-app-server-live
    paths:
      - evidence/codex-hosted-probe/latest.json
      - evidence/codex-github-models/latest.json
      - evidence/codex-github-models-matrix/latest.json
      - evidence/codex-live-two-turn/**/certification-receipt.json
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate a three-run PASS receipt
        id: gate
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const candidates=[
            'evidence/codex-hosted-probe/latest.json',
            'evidence/codex-github-models/latest.json',
            'evidence/codex-github-models-matrix/latest.json',
          ];
          let winner=null;
          for (const file of candidates) {
            if (!fs.existsSync(file)) continue;
            let value; try { value=JSON.parse(fs.readFileSync(file,'utf8')); } catch { continue; }
            if (value.status !== 'PASS') continue;
            const runs=value.runs ?? value.certification_runs ?? value.certification_receipt?.runs;
            const codexVersion=value.codex_version ?? value.official_codex_version ?? value.certification_receipt?.codex_version;
            const passCount=Array.isArray(runs) ? runs.filter(r => (r.status ?? r.result) === 'PASS').length : Number(value.consecutive_passes ?? value.certification_receipt?.consecutive_passes ?? 0);
            const exactThree=passCount === 3 || (Array.isArray(runs) && runs.length === 3 && runs.every(r => (r.status ?? r.result) === 'PASS'));
            const noResend=value.task_capsule_resent_on_turn_2 === false || (Array.isArray(runs) && runs.every(r => r.task_capsule_resent_on_turn_2 === false));
            const sameVersion=Boolean(codexVersion) || (Array.isArray(runs) && new Set(runs.map(r => r.codex_version).filter(Boolean)).size === 1);
            if (exactThree && noResend && sameVersion) { winner={file,value}; break; }
          }
          const output=process.env.GITHUB_OUTPUT;
          if (!winner) {
            fs.appendFileSync(output,'pass=false\n');
            process.exit(0);
          }
          fs.appendFileSync(output,'pass=true\n');
          fs.appendFileSync(output,`receipt=${winner.file}\n`);
          fs.writeFileSync('/tmp/codex-finalizer-summary.md',[
            '## Official Codex App Server certification PASS',
            '',
            `Validated receipt: \`${winner.file}\``,
            '',
            'The receipt proves exactly three consecutive official-binary runs, delta-only turn 2, and a single Codex version. The PR may leave Draft; canonical CI remains the merge gate.'
          ].join('\n')+'\n');
          NODE
      - name: Mark PR ready and post evidence
        if: steps.gate.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready 15 --repo "$GITHUB_REPOSITORY" || true
          gh pr comment 15 --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-finalizer-summary.md
      - name: Keep blocker explicit
        if: steps.gate.outputs.pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body='Official provider certification remains open. No valid three-consecutive-run PASS receipt is present. Contract/CI success must not be reported as provider success.'
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$body" || true
