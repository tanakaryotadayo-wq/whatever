name: Akashic Codex Turn Worker Compatibility

on:
  pull_request:
    paths:
      - "workers/codex/**"
      - "tests/test_stateful_turn_worker_v07.py"
      - ".github/workflows/codex-a2a-smoke.yml"
  push:
    branches:
      - akashic/v0.7-canonical-temporal-final
    paths:
      - "workers/codex/**"
      - "tests/test_stateful_turn_worker_v07.py"

permissions:
  contents: read

jobs:
  stateful-one-turn-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_stateful_turn_worker_v07.py

  live-boundary:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Ordinary CI intentionally does not authenticate or run the official Codex binary."
          echo "Use the manual self-hosted workflow: codex-live-acceptance.yml"
