name: Official Codex App Server via GitHub Models

on:
  push:
    branches:
      - akashic/v0.10-codex-app-server-live
    paths:
      - .github/workflows/codex-github-models-live.yml
      - packages/codex-app-server-adapter/**
      - fixtures/codex-live-two-turn/**
      - scripts/codex-app-server-live-three.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: codex-github-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AKASHIC_CODEX_LIVE: "1"
      AKASHIC_CODEX_LIVE_RUNS: "3"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: akashic/v0.10-codex-app-server-live
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install exact repository graph
        run: npm ci
      - name: Install official Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npm view @openai/codex version)"
          npm install --global "@openai/codex@${VERSION}"
          mkdir -p evidence/codex-github-models
          codex --version | tee evidence/codex-github-models/codex-version.txt
          printf '%s\n' "$VERSION" > evidence/codex-github-models/npm-version.txt
      - name: Discover GitHub Models catalog and configure Codex provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-home" evidence/codex-github-models
          export GITHUB_TOKEN="$GITHUB_MODELS_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token=os.environ['GITHUB_MODELS_TOKEN']
          endpoints=[
            'https://models.github.ai/catalog/models',
            'https://models.github.ai/catalog/models?limit=100',
          ]
          payload=None
          error=None
          for url in endpoints:
              try:
                  req=urllib.request.Request(url,headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'akashic-codex-certification',
                  })
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=json.load(r)
                  break
              except Exception as exc:
                  error=f'{type(exc).__name__}: {exc}'
          rows=payload if isinstance(payload,list) else (payload or {}).get('models',[]) if isinstance(payload,dict) else []
          def mid(row):
              return row.get('id') or row.get('name') or row.get('model') or ''
          ids=[mid(x) for x in rows if isinstance(x,dict) and mid(x)]
          preferred=[]
          for needle in ('openai/gpt-5','openai/gpt-4.1','openai/gpt-4o','gpt-5','gpt-4.1'):
              preferred.extend([x for x in ids if needle in x.lower()])
          selected=(preferred or [x for x in ids if 'openai/' in x.lower()] or ids or ['openai/gpt-4.1'])[0]
          summary={
              'schema':'akashic.github-models-provider-probe/v1',
              'status':'READY' if rows else 'CATALOG_FALLBACK',
              'catalog_count':len(ids),
              'selected_model':selected,
              'catalog_error':error,
              'credential_value_recorded':False,
          }
          Path('evidence/codex-github-models/provider.json').write_text(json.dumps(summary,indent=2)+'\n')
          Path(os.environ['RUNNER_TEMP'],'selected-model.txt').write_text(selected+'\n')
          PY
          MODEL="$(cat "$RUNNER_TEMP/selected-model.txt")"
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<EOF
          model = "$MODEL"
          model_provider = "github_models"

          [model_providers.github_models]
          name = "GitHub Models"
          base_url = "https://models.github.ai/inference"
          env_key = "GITHUB_MODELS_TOKEN"
          wire_api = "chat"
          EOF
          printf '%s\n' "$MODEL" > evidence/codex-github-models/selected-model.txt
      - name: Official App Server three-run certification through GitHub Models
        id: live
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set +e
          npm run test:codex-live
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record provider result
        shell: bash
        env:
          LIVE_EXIT_CODE: ${{ steps.live.outputs.exit_code }}
        run: |
          set -euo pipefail
          receipt="$(find evidence/codex-live-two-turn -name certification-receipt.json -type f 2>/dev/null | sort | tail -n 1)"
          if [[ "${LIVE_EXIT_CODE:-1}" == "0" && -n "$receipt" ]]; then
            cp "$receipt" evidence/codex-github-models/latest.json
          else
            RECEIPT="$receipt" node - <<'NODE'
          const fs=require('node:fs');
          const provider=JSON.parse(fs.readFileSync('evidence/codex-github-models/provider.json','utf8'));
          fs.writeFileSync('evidence/codex-github-models/latest.json',JSON.stringify({
            schema:'akashic.codex-provider-certification-status/v1',
            status:'FAILED',
            provider:'github-models',
            official_codex_binary:true,
            selected_model:provider.selected_model,
            exit_code:Number(process.env.LIVE_EXIT_CODE||1),
            receipt_found:Boolean(process.env.RECEIPT),
            source_commit:process.env.GITHUB_SHA,
            credential_value_recorded:false,
            recorded_at:new Date().toISOString()
          },null,2)+'\n');
          NODE
          fi
      - name: Commit non-secret status
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f evidence/codex-github-models/provider.json evidence/codex-github-models/latest.json evidence/codex-github-models/codex-version.txt evidence/codex-github-models/npm-version.txt evidence/codex-github-models/selected-model.txt
          if git diff --cached --quiet; then
            echo "No status change"
          else
            git commit -m "evidence(codex): record GitHub Models App Server result [skip ci]"
            git push origin HEAD:akashic/v0.10-codex-app-server-live
          fi
      - name: Upload complete provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-github-models-${{ github.sha }}
          path: |
            evidence/codex-github-models
            evidence/codex-live-two-turn
          if-no-files-found: error
          retention-days: 30
      - name: Enforce certification result
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync('evidence/codex-github-models/latest.json','utf8'));
          if (result.status !== 'PASS') {
            console.error(JSON.stringify(result));
            process.exit(1);
          }
          NODE
