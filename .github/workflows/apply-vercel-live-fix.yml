name: Apply Vercel live-discovered fix

on:
  push:
    branches:
      - 'akashic/v0.9-vercel-live-acceptance'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: akashic/v0.9-vercel-live-acceptance
      - name: Patch canonical Vercel adapter and add regression evidence
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('deploy/vercel-chatgpt-app/workflows/run-agent-task.js')
          workflow = workflow_path.read_text()
          anchor = '''export function applyContextDeltaToVercelSnapshot(snapshot, delta) {
            const validated = validateContextDelta(snapshot, delta);
            validateTransition(snapshot.state, "WORKING");
            return {
              ...clone(snapshot),
              state: "WORKING",
              terminal: false,
              state_seq: snapshot.state_seq + 1,
              context_seq: snapshot.context_seq + 1,
              context_need: null,
              last_context_delta_ref: clone(validated.delta_ref),
              applied_delta_ids: [...(snapshot.applied_delta_ids ?? []), validated.delta_id],
            };
          }
          '''
          helper = anchor + '''
          export function beginAgentTurn(snapshot) {
            if (TERMINAL_STATES.has(snapshot.state)) return clone(snapshot);
            const turnNo = snapshot.turn_no + 1;
            if (snapshot.state === "WORKING") {
              return {
                ...clone(snapshot),
                state: "WORKING",
                terminal: false,
                state_seq: snapshot.state_seq + 1,
                turn_no: turnNo,
              };
            }
            return transitionVercelSnapshot(snapshot, "WORKING", { turn_no: turnNo });
          }
          '''
          if 'export function beginAgentTurn' not in workflow:
              if anchor not in workflow:
                  raise SystemExit('context delta anchor missing')
              workflow = workflow.replace(anchor, helper)
          old_loop = '''        const turnNo = snapshot.turn_no + 1;
                  snapshot = transitionVercelSnapshot(snapshot, "WORKING", {
                    turn_no: turnNo,
                  });
                  await emitProjectionStep(snapshotProjection(snapshot));

                  const output = await runAgentTurnStep({
                    task,
                    turn_no: turnNo,
          '''
          new_loop = '''        snapshot = beginAgentTurn(snapshot);
                  const turnNo = snapshot.turn_no;
                  await emitProjectionStep(snapshotProjection(snapshot));

                  const output = await runAgentTurnStep({
                    task,
                    turn_no: turnNo,
          '''
          if old_loop in workflow:
              workflow = workflow.replace(old_loop, new_loop)
          elif 'snapshot = beginAgentTurn(snapshot);' not in workflow:
              raise SystemExit('turn loop anchor missing')
          workflow_path.write_text(workflow)

          route_path = Path('deploy/vercel-chatgpt-app/app/api/acceptance/vercel-p0/route.js')
          route = route_path.read_text()
          old_sequence = '''    const resume = await applyWhenHookReady(runId, validDelta);
              const terminal = await waitForState(
                runId,
                (value) => ["COMPLETED", "FAILED", "CANCELED"].includes(value?.snapshot?.state),
              );
              const replay = await startVercelWorkflow(task);
              const finalSnapshot = terminal.snapshot;
          '''
          new_sequence = '''    const activeReplay = await startVercelWorkflow(task);
              const resume = await applyWhenHookReady(runId, validDelta);
              const terminal = await waitForState(
                runId,
                (value) => ["COMPLETED", "FAILED", "CANCELED"].includes(value?.snapshot?.state),
              );
              const finalSnapshot = terminal.snapshot;
          '''
          if old_sequence in route:
              route = route.replace(old_sequence, new_sequence)
          route = route.replace(
              '''      duplicate_submit_idempotent:
                      replay.idempotent_replay === true && replay.run_id === runId,
              ''',
              '''      active_duplicate_submit_idempotent:
                      activeReplay.idempotent_replay === true &&
                      activeReplay.run_id === runId,
              ''',
          )
          route = route.replace(
              '''          replay: {
                        run_id: replay.run_id,
                        idempotent_replay: replay.idempotent_replay,
                        owner_registration: replay.owner_registration,
                      },
              ''',
              '''          active_replay: {
                        run_id: activeReplay.run_id,
                        idempotent_replay: activeReplay.idempotent_replay,
                        owner_registration: activeReplay.owner_registration,
                      },
              ''',
          )
          if 'active_duplicate_submit_idempotent' not in route:
              raise SystemExit('acceptance route patch did not apply')
          route_path.write_text(route)

          test_path = Path('deploy/vercel-chatgpt-app/tests/vercel-live-regression.test.mjs')
          test_path.write_text(textwrap.dedent('''
          import assert from "node:assert/strict";
          import test from "node:test";
          import {
            applyContextDeltaToVercelSnapshot,
            beginAgentTurn,
            initialVercelSnapshot,
            transitionVercelSnapshot,
          } from "../workflows/run-agent-task.js";

          const digest = (character) => `sha256:${character.repeat(64)}`;
          const task = {
            schema: "akashic.task-capsule/v1",
            task_id: "turn-resume-task",
            context_id: "turn-resume-context",
            logical_attempt_id: "turn-resume-attempt",
            goal: "Resume a second Agent turn after context",
            acceptance: ["no WORKING to WORKING transition error"],
            context_refs: [],
            execution_hash: digest("f"),
          };
          const ref = { media_type: "application/json", digest: digest("a"), size: 1, uri: "fixture://delta" };

          function waitingSnapshot() {
            const submitted = initialVercelSnapshot(task, "run-1");
            const compiling = transitionVercelSnapshot(submitted, "COMPILING_CONTEXT");
            const working = beginAgentTurn(compiling);
            return transitionVercelSnapshot(working, "INPUT_REQUIRED", {
              context_need: {
                schema: "akashic.context-need/v1",
                request_id: "need-1",
                task_id: task.task_id,
                logical_attempt_id: task.logical_attempt_id,
                expected_seq: 0,
                missing: ["context"],
                known_digests: [],
                max_tokens: 1024,
              },
            });
          }

          test("accepted context starts turn 2 without an illegal WORKING self-transition", () => {
            const resumed = applyContextDeltaToVercelSnapshot(waitingSnapshot(), {
              delta_id: "delta-1",
              task_id: task.task_id,
              logical_attempt_id: task.logical_attempt_id,
              request_id: "need-1",
              expected_seq: 0,
              delta_ref: ref,
            });
            assert.equal(resumed.state, "WORKING");
            assert.equal(resumed.turn_no, 1);
            const secondTurn = beginAgentTurn(resumed);
            assert.equal(secondTurn.state, "WORKING");
            assert.equal(secondTurn.turn_no, 2);
            assert.equal(secondTurn.state_seq, resumed.state_seq + 1);
          });
          ''').lstrip())

          Path('docs/ADR-0009-VERCEL-ACTIVE-RUN-IDEMPOTENCY.md').write_text(textwrap.dedent('''
          # ADR-0009 — Vercel Workflow Active-Run Idempotency and Turn Advancement

          Status: ACCEPTED  
          Date: 2026-08-16

          ## Evidence

          The first live Vercel Workflow P0 run reached `INPUT_REQUIRED`, rejected a stale `ContextPacketDelta` with `STALE_SEQUENCE`, and accepted the valid delta on the same run. It then exposed two assumptions that fixture-only tests had not exercised:

          1. `applyContextDeltaToVercelSnapshot()` already performs `INPUT_REQUIRED -> WORKING`; the next Agent turn must advance `turn_no` without attempting an illegal `WORKING -> WORKING` state transition.
          2. Vercel hook tokens coordinate duplicate starts only while the owner hook is active. After a terminal run disposes its hook, the token is reusable. Completed-result idempotency requires a separate durable result index and is not provided by `start()` itself.

          ## Decision

          - Add `beginAgentTurn()` as a non-state-changing turn event when the snapshot is already `WORKING`.
          - Test duplicate submit while the original run is waiting in `INPUT_REQUIRED`, which is the guarantee provided by Vercel Workflow hook conflict semantics.
          - Do not claim post-terminal duplicate reuse until Akashic has a selected authoritative completed-result index.
          - Preserve Effect Ledger fencing for external side effects; run-start idempotency and effect idempotency remain separate concerns.
          ''').lstrip())

          Path('.github/workflows/apply-vercel-live-fix.yml').unlink()
          PY
      - name: Commit repaired adapter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(vercel): advance resumed turns and align active-run idempotency'
          git push origin HEAD:akashic/v0.9-vercel-live-acceptance
