name: Official Codex live acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-two-turn:
    if: ${{ vars.CODEX_LIVE_RUNNER_ENABLED == 'true' }}
    runs-on: [self-hosted, macOS, akashic-codex]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Real subscription-auth Codex two-turn
        env:
          AKASHIC_CODEX_LIVE: '1'
        run: npm run test:codex-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-live-evidence
          path: .akashic-runtime/live-codex
