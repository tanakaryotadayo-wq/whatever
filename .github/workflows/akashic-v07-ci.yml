name: Akashic v0.7 canonical CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'workflows/**'
      - 'apps/temporal-runner/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'schemas/v1/**'
      - 'recovery/**'
      - 'package*.json'
      - '.github/workflows/akashic-v07-ci.yml'
  push:
    branches:
      - 'akashic/v0.7-canonical-final'

permissions:
  contents: read

jobs:
  contract-and-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run doctor
      - run: npm run test:schemas
      - run: npm run test:core
      - run: npm run test:p0
      - name: Existing gateway tests
        run: npm --prefix deploy/vercel-chatgpt-app test
      - name: Existing Cloudflare conformance tests
        run: npm --prefix deploy/cloudflare-kernel test
