name: Akashic v0.8 knowledge packet integration

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'knowledge/**'
      - 'plugins/**'
      - 'packages/**'
      - 'workflows/**'
      - 'apps/temporal-runner/**'
      - 'experiments/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'schemas/v1/**'
      - 'docs/**'
      - 'package*.json'
      - '.github/workflows/akashic-v08-ci.yml'
  push:
    branches:
      - 'akashic/v0.8-knowledge-packet-import'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve workspace dependencies and refresh lockfile
        run: npm install
      - name: Preserve generated lockfile for source reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: akashic-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit refreshed lockfile to the source branch
        if: >-
          (github.event_name == 'push' && github.ref_name == 'akashic/v0.8-knowledge-packet-import') ||
          (github.event_name == 'pull_request' && github.head_ref == 'akashic/v0.8-knowledge-packet-import')
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): refresh reproducible npm lockfile'
          git push origin "HEAD:${SOURCE_BRANCH}"
      - run: npm run doctor
      - run: npm run test:schemas
      - run: npm run test:knowledge
      - run: npm run test:core
      - run: npm run test:p0
      - name: Existing gateway tests
        run: npm --prefix deploy/vercel-chatgpt-app test
      - name: Existing Cloudflare conformance tests
        run: npm --prefix deploy/cloudflare-kernel test
