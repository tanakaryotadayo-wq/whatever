name: Sync Codex Mode manifest

on:
  push:
    branches:
      - akashic/codex-mode-gpt-actions-v1
    paths:
      - docs/modes/CODEX_MODE.md
      - docs/modes/CODEX_MODE_POINTER.md
      - docs/modes/CODEX_MODE_STATE.json
      - docs/modes/CODEX_MODE_HANDOFF.json
      - schemas/v1/codex-mode-state.schema.json
      - schemas/v1/codex-mode-handoff.schema.json
      - scripts/validate-codex-mode.mjs
      - scripts/codex-mode-status.mjs
      - scripts/regenerate-codex-mode-manifest.mjs
      - .agents/skills/codex-mode/SKILL.md
      - .github/agents/codex-mode.agent.md
      - docs/ADR-0012-CODEX-MODE-UX.md
      - docs/ADR-0013-CODEX-MODE-HANDOFF-STATE-INTEGRITY.md
      - docs/AUDIT-2026-08-16.md
      - docs/AUDIT-2026-08-16.json
      - .github/workflows/codex-mode-manifest-sync.yml

permissions:
  contents: write

concurrency:
  group: codex-mode-manifest-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regenerate manifest from exact bytes
        run: node scripts/regenerate-codex-mode-manifest.mjs
      - name: Commit only when stale
        shell: bash
        run: |
          if git diff --quiet -- docs/modes/MANIFEST_CODEX_MODE_20260816.json; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modes/MANIFEST_CODEX_MODE_20260816.json
          git commit -m "fix(mode): regenerate Codex Mode v1.2 manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
