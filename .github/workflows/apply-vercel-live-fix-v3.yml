name: Apply Vercel live fix v3

on:
  push:
    branches:
      - 'akashic/v0.9-vercel-live-acceptance'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: akashic/v0.9-vercel-live-acceptance
      - name: Apply structural patch and regression evidence
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('deploy/vercel-chatgpt-app/workflows/run-agent-task.js')
          workflow_lines = workflow_path.read_text().splitlines()

          if not any('export function beginAgentTurn' in line for line in workflow_lines):
              marker_index = next(
                  (i for i, line in enumerate(workflow_lines) if line.startswith('async function emitProjectionStep(event)')),
                  None,
              )
              if marker_index is None:
                  raise SystemExit('emitProjectionStep marker missing')
              helper = textwrap.dedent('''
              export function beginAgentTurn(snapshot) {
                if (TERMINAL_STATES.has(snapshot.state)) return clone(snapshot);
                const turnNo = snapshot.turn_no + 1;
                if (snapshot.state === "WORKING") {
                  return {
                    ...clone(snapshot),
                    state: "WORKING",
                    terminal: false,
                    state_seq: snapshot.state_seq + 1,
                    turn_no: turnNo,
                  };
                }
                return transitionVercelSnapshot(snapshot, "WORKING", { turn_no: turnNo });
              }
              ''').strip('\n').splitlines()
              workflow_lines[marker_index:marker_index] = helper + ['']

          loop_index = next(
              (i for i, line in enumerate(workflow_lines) if 'const turnNo = snapshot.turn_no + 1;' in line and line.startswith('        ')),
              None,
          )
          if loop_index is not None:
              block = workflow_lines[loop_index:loop_index + 5]
              expected = [
                  'const turnNo = snapshot.turn_no + 1;',
                  'snapshot = transitionVercelSnapshot(snapshot, "WORKING", {',
                  'turn_no: turnNo,',
                  '});',
                  'await emitProjectionStep(snapshotProjection(snapshot));',
              ]
              normalized = [line.strip() for line in block]
              if normalized != expected:
                  raise SystemExit(f'unexpected turn block: {normalized!r}')
              indent = workflow_lines[loop_index][:-len(workflow_lines[loop_index].lstrip())]
              workflow_lines[loop_index:loop_index + 5] = [
                  f'{indent}snapshot = beginAgentTurn(snapshot);',
                  f'{indent}const turnNo = snapshot.turn_no;',
                  f'{indent}await emitProjectionStep(snapshotProjection(snapshot));',
              ]

          if not any('snapshot = beginAgentTurn(snapshot);' in line for line in workflow_lines):
              raise SystemExit('turn-loop patch missing')
          workflow_path.write_text('\n'.join(workflow_lines) + '\n')

          route_path = Path('deploy/vercel-chatgpt-app/app/api/acceptance/vercel-p0/route.js')
          route_lines = route_path.read_text().splitlines()
          if not any('const activeReplay = await startVercelWorkflow(task);' in line for line in route_lines):
              resume_index = next(
                  (i for i, line in enumerate(route_lines) if 'const resume = await applyWhenHookReady(runId, validDelta);' in line),
                  None,
              )
              if resume_index is None:
                  raise SystemExit('resume anchor missing')
              indent = route_lines[resume_index][:-len(route_lines[resume_index].lstrip())]
              route_lines.insert(resume_index, f'{indent}const activeReplay = await startVercelWorkflow(task);')

          route_lines = [
              line for line in route_lines
              if 'const replay = await startVercelWorkflow(task);' not in line
          ]
          route_text = '\n'.join(route_lines) + '\n'
          route_text = route_text.replace('duplicate_submit_idempotent:', 'active_duplicate_submit_idempotent:')
          route_text = route_text.replace('replay.idempotent_replay', 'activeReplay.idempotent_replay')
          route_text = route_text.replace('replay.run_id', 'activeReplay.run_id')
          route_text = route_text.replace('replay.owner_registration', 'activeReplay.owner_registration')
          route_text = route_text.replace('          replay: {', '          active_replay: {')
          if 'active_duplicate_submit_idempotent' not in route_text or 'const activeReplay' not in route_text:
              raise SystemExit('acceptance route patch incomplete')
          route_path.write_text(route_text)

          Path('deploy/vercel-chatgpt-app/tests/vercel-live-regression.test.mjs').write_text(textwrap.dedent('''
          import assert from "node:assert/strict";
          import test from "node:test";
          import {
            applyContextDeltaToVercelSnapshot,
            beginAgentTurn,
            initialVercelSnapshot,
            transitionVercelSnapshot,
          } from "../workflows/run-agent-task.js";

          const digest = (character) => `sha256:${character.repeat(64)}`;
          const task = {
            schema: "akashic.task-capsule/v1",
            task_id: "turn-resume-task",
            context_id: "turn-resume-context",
            logical_attempt_id: "turn-resume-attempt",
            goal: "Resume a second Agent turn after context",
            acceptance: ["no WORKING to WORKING transition error"],
            context_refs: [],
            execution_hash: digest("f"),
          };
          const ref = {
            media_type: "application/json",
            digest: digest("a"),
            size: 1,
            uri: "fixture://delta",
          };

          function waitingSnapshot() {
            const submitted = initialVercelSnapshot(task, "run-1");
            const compiling = transitionVercelSnapshot(submitted, "COMPILING_CONTEXT");
            const working = beginAgentTurn(compiling);
            return transitionVercelSnapshot(working, "INPUT_REQUIRED", {
              context_need: {
                schema: "akashic.context-need/v1",
                request_id: "need-1",
                task_id: task.task_id,
                logical_attempt_id: task.logical_attempt_id,
                expected_seq: 0,
                missing: ["context"],
                known_digests: [],
                max_tokens: 1024,
              },
            });
          }

          test("accepted context starts turn 2 without an illegal WORKING self-transition", () => {
            const resumed = applyContextDeltaToVercelSnapshot(waitingSnapshot(), {
              delta_id: "delta-1",
              task_id: task.task_id,
              logical_attempt_id: task.logical_attempt_id,
              request_id: "need-1",
              expected_seq: 0,
              delta_ref: ref,
            });
            assert.equal(resumed.state, "WORKING");
            assert.equal(resumed.turn_no, 1);
            const secondTurn = beginAgentTurn(resumed);
            assert.equal(secondTurn.state, "WORKING");
            assert.equal(secondTurn.turn_no, 2);
            assert.equal(secondTurn.state_seq, resumed.state_seq + 1);
          });
          ''').lstrip())

          Path('docs/ADR-0009-VERCEL-ACTIVE-RUN-IDEMPOTENCY.md').write_text(textwrap.dedent('''
          # ADR-0009 — Vercel Workflow Active-Run Idempotency and Turn Advancement

          Status: ACCEPTED  
          Date: 2026-08-16

          ## Evidence

          The first live Vercel Workflow P0 run reached `INPUT_REQUIRED`, rejected a stale `ContextPacketDelta` with `STALE_SEQUENCE`, and accepted the valid delta on the same run. It then exposed two assumptions that fixture-only tests had not exercised:

          1. `applyContextDeltaToVercelSnapshot()` already performs `INPUT_REQUIRED -> WORKING`; the next Agent turn must advance `turn_no` without attempting an illegal `WORKING -> WORKING` state transition.
          2. Vercel hook tokens coordinate duplicate starts only while the owner hook is active. After a terminal run disposes its hook, the token is reusable. Completed-result idempotency requires a separate durable result index and is not provided by `start()` itself.

          ## Decision

          - Add `beginAgentTurn()` as a non-state-changing turn event when the snapshot is already `WORKING`.
          - Test duplicate submit while the original run is waiting in `INPUT_REQUIRED`, matching Vercel's documented active-run hook guarantee.
          - Do not claim post-terminal duplicate reuse until Akashic has a selected authoritative completed-result index.
          - Preserve Effect Ledger fencing for external side effects; run-start idempotency and effect idempotency remain separate concerns.
          ''').lstrip())

          for transient in [
              Path('.github/workflows/apply-vercel-live-fix.yml'),
              Path('.github/workflows/apply-vercel-live-fix-v2.yml'),
              Path('.github/workflows/apply-vercel-live-fix-v3.yml'),
          ]:
              if transient.exists():
                  transient.unlink()
          PY
      - name: Commit repaired adapter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(vercel): advance resumed turns and align active-run idempotency'
          git push origin HEAD:akashic/v0.9-vercel-live-acceptance
